name: Release

# HACS installs a Dashboard (plugin) repository from its GitHub release
# assets, so every published release needs the built bundle attached.
on:
  release:
    types:
      - published

permissions: {}

jobs:
  build:
    name: "Build and attach bundle"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Attach bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/matrix-helper-card.js --clobber --repo "$GITHUB_REPOSITORY"
